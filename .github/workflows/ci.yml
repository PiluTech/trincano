name: CI

# Validação: swiftlint (strict), testes do Xcode e build Release sem assinatura.
# Roda em PR e em push na main; também é chamado pelo release.yml (workflow_call).
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_call:

# Um run por ref; um push novo cancela o anterior (no release.yml o grupo é o dele).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Lint, testes e build Release
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Versões
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      # Mesma versão da máquina local (0.65.1); o binário portátil é conferido pelo sha256 do release.
      - name: SwiftLint 0.65.1 (fixado)
        env:
          SWIFTLINT_VERSION: "0.65.1"
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/swiftlint"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $dir/swiftlint.zip" | shasum -a 256 -c -
          unzip -q -o "$dir/swiftlint.zip" -d "$dir"
          chmod +x "$dir/swiftlint"
          echo "$dir" >> "$GITHUB_PATH"
          [[ "$("$dir/swiftlint" --version)" == "$SWIFTLINT_VERSION" ]]

      - name: SwiftLint (strict)
        run: swiftlint lint --strict

      - name: Testes
        run: |
          set -o pipefail
          xcodebuild -project Ice.xcodeproj -scheme TrincanoTests -destination 'platform=macOS' \
            -derivedDataPath build test CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO

      - name: Build Release (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild -project Ice.xcodeproj -scheme Ice -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO build | tail -n 5

      - name: Catálogo PT-BR, ícones e appcast
        run: |
          scripts/extract-strings.py check
          swiftc -o build/check-icon-bundle scripts/check-icon-bundle.swift
          build/check-icon-bundle build/Build/Products/Release/Trincano.app
          scripts/test-appcast.sh
          scripts/test-install.sh
